name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run — keeps the queue
# short and the sub-4-minute target (M0-03) realistic as the repo grows.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches docker-compose.yml and production in everything that affects
  # behaviour, including the C collation — Postgres sorts differently under
  # different locales, and a schema verified under one collation is not verified
  # under another.
  #
  # The one deliberate difference is the *name*. `packages/server/src/test-setup.ts`
  # refuses to run the destructive suites against a database whose name does not
  # end in `_test` or `_ci`, so CI is named to say what it is: disposable.
  DATABASE_URL: postgres://tailfin:tailfin_ci@127.0.0.1:5432/tailfin_test

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tailfin
          POSTGRES_PASSWORD: tailfin_ci
          POSTGRES_DB: tailfin_test
          POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tailfin -d tailfin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build the production bundles
        # The step that proves a pull request can actually ship.
        #
        # `pnpm typecheck` is `tsc -b`, and ADR-0001 is explicit that TypeScript
        # is the typechecker here rather than the compiler — `moduleResolution:
        # bundler` cannot emit runnable Node output. So typecheck never produces
        # the artefacts that run in production, and until this step existed a PR
        # could typecheck, lint, format and pass all 1,482 tests while the
        # esbuild bundle or the Vite build was broken. The first sign of it
        # would have been `deploy.sh` failing on the box.
        #
        # It also guards the one-off jobs. CLAUDE.md's rule that "one-off jobs
        # run from `dist`, not from source" makes `data:airports`,
        # `data:classify`, `data:catchment`, `data:distances`, `data:timezones`, `world:seed`,
        # `demand:generate`, `admin` and `ops:status` all bundle entry points —
        # and an entry point dropped from `build.mjs` is invisible to every
        # other check in this file.
        #
        # Placed before the database steps because it needs no Postgres and
        # takes seconds: a tree that cannot build should not spend two minutes
        # running tests. It does not depend on the typecheck step either — both
        # workspace packages resolve to `./src/index.ts` at runtime, so esbuild
        # and Vite compile from source rather than from `tsc -b` output.
        run: pnpm build:apps

      - name: Test the running Caddy security policy
        # Exercise the committed Caddyfile itself in report-only and enforced
        # modes. The release archive is pinned and verified before execution;
        # this keeps the test on the same Caddy version as the server runbook.
        run: |
          set -euo pipefail
          caddy_archive=caddy_2.11.4_linux_amd64.tar.gz
          curl -fsSLo "$caddy_archive" \
            "https://github.com/caddyserver/caddy/releases/download/v2.11.4/$caddy_archive"
          echo "527fbf917c39189a1e3b31d34fa955601680b2d5c8055d2a87b8b9588dec7bb9  $caddy_archive" \
            | sha256sum --check
          tar -xzf "$caddy_archive" caddy
          pnpm security:headers --integration ./caddy

      - name: Verify the build produced what deploy expects
        # A build step on its own only proves the command exited zero. esbuild
        # writing an empty file, or an entry point quietly disappearing, would
        # both pass the step above — so assert the artefacts rather than trust
        # the exit code. `-s` catches empty as well as missing.
        #
        # The build number is deliberately *not* asserted. `actions/checkout`
        # clones shallow, so `git rev-list --count HEAD` sees one commit and
        # every CI build stamps 1. That is harmless — this artefact is
        # discarded, and `deploy.sh` builds from a full clone on the box — but
        # it is worth writing down before somebody asserts the number and
        # cannot work out why it is wrong. The *shape* is checked, because a
        # malformed stamp would break `/api/version` and OPS-02 at runtime.
        run: |
          set -euo pipefail
          missing=0
          for f in \
            packages/server/dist/main.js \
            packages/server/dist/migrate.js \
            packages/server/dist/import-airports.js \
            packages/server/dist/classify-airports.js \
            packages/server/dist/derive-catchment.js \
            packages/server/dist/build-distance-matrix.js \
            packages/server/dist/seed-world.js \
            packages/server/dist/admin-cli.js \
            packages/server/dist/ops-status.js \
            packages/server/dist/generate-demand.js \
            packages/server/dist/assign-timezones.js \
            packages/server/dist/build-info.json \
            packages/web/dist/client/index.html
          do
            if [ ! -s "$f" ]; then
              echo "::error::build produced no $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const stamp = JSON.parse(
              readFileSync("packages/server/dist/build-info.json", "utf8"),
            );
            if (typeof stamp.build !== "number" || typeof stamp.commit !== "string" || stamp.commit === "") {
              console.error("::error::build-info.json is malformed:", stamp);
              process.exit(1);
            }
            console.log("build stamp:", stamp.build, stamp.commit);
          '

      - name: Apply migrations
        # The schema constraint tests need a migrated database. This also means
        # every migration is proven to apply cleanly on every PR, which is
        # M0-05's acceptance criterion turned into a standing check.
        run: pnpm db:migrate

      - name: Test with coverage
        # Coverage thresholds are enforced for packages/sim (M0-04).
        run: pnpm test:coverage

      - name: Performance budget
        # Deliberately a separate, uninstrumented run. M1-08's budget is "5,000
        # flights interpolated in under 16ms", and V8 coverage costs about 5x on
        # that code path — measuring it under instrumentation would be measuring
        # the instrumentation. Only the sim project runs, so this costs seconds.
        run: pnpm test:perf

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
