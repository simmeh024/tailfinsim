name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run — keeps the queue
# short and the sub-4-minute target (M0-03) realistic as the repo grows.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches docker-compose.yml and production, including the C collation —
  # Postgres sorts differently under different locales, and a schema verified
  # under one collation is not verified under another.
  DATABASE_URL: postgres://tailfin:tailfin_ci@127.0.0.1:5432/tailfin

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tailfin
          POSTGRES_PASSWORD: tailfin_ci
          POSTGRES_DB: tailfin
          POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tailfin -d tailfin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Apply migrations
        # The schema constraint tests need a migrated database. This also means
        # every migration is proven to apply cleanly on every PR, which is
        # M0-05's acceptance criterion turned into a standing check.
        run: pnpm db:migrate

      - name: Test with coverage
        # Coverage thresholds are enforced for packages/sim (M0-04).
        run: pnpm test:coverage

      - name: Performance budget
        # Deliberately a separate, uninstrumented run. M1-08's budget is "5,000
        # flights interpolated in under 16ms", and V8 coverage costs about 5x on
        # that code path — measuring it under instrumentation would be measuring
        # the instrumentation. Only the sim project runs, so this costs seconds.
        run: pnpm test:perf

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
