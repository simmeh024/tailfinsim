# Production stack for the DreamCompute instance. Not used in local development
# — see docker-compose.yml at the repository root for that.
#
# Lives at /opt/tailfin/docker-compose.yml on the server, alongside a .env that
# is never committed. See deploy/README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      # Must match local development, or ordering differs between the machine
      # you test on and the machine that matters.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No ports section. Postgres is reachable only over the compose network;
    # it is never published to the host, let alone the internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  server:
    image: ${TAILFIN_IMAGE:-ghcr.io/simmeh024/tailfinsim/server:production}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://tailfinsim.com}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  postgres-data:
  caddy-data: # holds the TLS certificates — losing this means re-issuing
  caddy-config:
