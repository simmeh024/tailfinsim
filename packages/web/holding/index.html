<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tailfin — coming soon</title>
    <meta
      name="description"
      content="Tailfin is a real-time online airline management sim. One shared world, running at double speed, that never pauses. Coming soon."
    />
    <meta name="theme-color" content="#060a12" />

    <meta property="og:title" content="Tailfin — coming soon" />
    <meta
      property="og:description"
      content="A real-time online airline management sim. One shared world, running at double speed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tailfinsim.com/" />

    <!-- Inline so the page makes zero external requests: no fonts, no CDN, no
         analytics. One document, one paint. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060a12'/%3E%3Cpath d='M12 25V12.5L21.5 7v18z' fill='%23ffb84d'/%3E%3C/svg%3E"
    />

    <style>
      :root {
        --bg: #060a12;
        --bg-lift: #0b1220;
        --ink: #eef2f8;
        --muted: #8494ad;
        --accent: #ffb84d;
        --hairline: rgba(132, 148, 173, 0.16);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        /* The glow and the background SVG both extend past the viewport by
           design. `clip` contains them without creating a scroll container —
           `overflow: hidden` on body alone still left html's scroll box at
           450px on a 375px viewport, which lets mobile rubber-band sideways. */
        overflow: clip;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        overflow: hidden;
        position: relative;
      }

      /* Horizon glow — suggests a world curving away below the fold. */
      body::after {
        content: '';
        position: absolute;
        inset: auto -20% -55% -20%;
        height: 90vh;
        background: radial-gradient(
          ellipse at 50% 0%,
          rgba(255, 184, 77, 0.11) 0%,
          rgba(70, 110, 180, 0.08) 38%,
          transparent 72%
        );
        pointer-events: none;
      }

      .sky {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      main {
        position: relative;
        text-align: center;
        padding: 2rem clamp(1rem, 5vw, 2rem);
        max-width: min(46rem, 100%);
      }

      .eyebrow {
        margin: 0 0 clamp(1.1rem, 3.5vw, 1.9rem);
        font-size: clamp(0.55rem, 1.6vw, 0.72rem);
        /* Tracking has to shrink with the viewport or this line, which is long,
           runs off the side before the font-size clamp ever bottoms out. */
        letter-spacing: clamp(0.16em, 1.1vw, 0.42em);
        text-transform: uppercase;
        color: var(--muted);
        text-wrap: balance;
      }

      h1 {
        margin: 0;
        /* 7 glyphs plus tracking come to roughly 5x the font-size, so the vw
           term has to stay under ~14 or the wordmark overflows on narrow
           viewports. Verified at 375px, 573px and 1280px. */
        font-size: clamp(2.3rem, 13vw, 8.5rem);
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: clamp(0.01em, 0.7vw, 0.09em);
        /* Optical correction: trailing tracking leaves a gap on the right. */
        text-indent: clamp(0.01em, 0.7vw, 0.09em);
        background: linear-gradient(178deg, #ffffff 12%, #b9c6da 96%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.6rem, 2.2vw, 1.1rem);
        margin-top: clamp(0.7rem, 2.4vw, 1.15rem);
      }

      .rule {
        height: 1px;
        width: clamp(1.6rem, 9vw, 5.5rem);
        background: linear-gradient(90deg, transparent, var(--hairline), transparent);
      }

      .sim {
        font-size: clamp(0.68rem, 2vw, 0.86rem);
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }

      .tagline {
        margin: clamp(1.9rem, 6vw, 3.1rem) auto 0;
        font-size: clamp(1rem, 2.9vw, 1.32rem);
        line-height: 1.55;
        color: var(--ink);
        max-width: 24ch;
      }

      .tagline .stay {
        display: block;
        margin-top: 0.35rem;
        color: var(--muted);
      }

      .footnote {
        margin: clamp(2.4rem, 7vw, 3.6rem) 0 0;
        font-size: clamp(0.66rem, 1.7vw, 0.76rem);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(132, 148, 173, 0.62);
      }

      /* The route arc, drawn once then held. */
      .route {
        stroke: var(--accent);
        stroke-width: 1.15;
        fill: none;
        opacity: 0.5;
        stroke-dasharray: 1 3.2;
        stroke-linecap: round;
      }

      .route-ghost {
        stroke: var(--hairline);
        stroke-width: 1;
        fill: none;
      }

      .node {
        fill: var(--accent);
        opacity: 0.85;
      }

      .plane {
        fill: #ffffff;
      }

      @keyframes drift {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -42;
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 0.85;
        }
      }

      .route {
        animation: drift 5.5s linear infinite;
      }

      .node--b {
        animation: breathe 3.4s ease-in-out infinite;
      }

      /* Honour the OS setting: hold everything still, lose nothing. */
      @media (prefers-reduced-motion: reduce) {
        .route,
        .node--b {
          animation: none;
        }
        .plane-motion {
          display: none;
        }
        .plane-static {
          display: block;
        }
      }

      .plane-static {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- Decorative only, so hidden from assistive tech. The page reads fine
         without it. -->
    <svg
      class="sky"
      viewBox="0 0 1200 700"
      preserveAspectRatio="xMidYMid slice"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Faint latitude curves. -->
      <g class="route-ghost" opacity="0.55">
        <path d="M-40 214 Q 600 122 1240 214" />
        <path d="M-40 352 Q 600 246 1240 352" />
        <path d="M-40 508 Q 600 386 1240 508" />
      </g>

      <!-- The great-circle the aircraft flies. Kept in the lower third so it
           never crosses the wordmark — an aircraft flying through the middle of
           the letters reads as a collision rather than a route. -->
      <path id="arc" class="route-ghost" d="M120 664 Q 600 500 1080 596" opacity="0.5" />
      <path class="route" d="M120 664 Q 600 500 1080 596" />

      <circle class="node" cx="120" cy="664" r="3.6" />
      <circle class="node node--b" cx="1080" cy="596" r="4.6" />

      <g class="plane-motion">
        <!-- Nose points along +x so the path's own tangent orients it. -->
        <path
          class="plane"
          d="M-7 0 L 6 0 M 1 0 L -3.5 -5 M 1 0 L -3.5 5 M -5.5 0 L -7.5 -2.6 M -5.5 0 L -7.5 2.6"
          stroke="#ffffff"
          stroke-width="1.7"
          stroke-linecap="round"
          fill="none"
        />
        <animateMotion
          dur="15s"
          repeatCount="indefinite"
          rotate="auto"
          keyPoints="0;1"
          keyTimes="0;1"
          calcMode="linear"
        >
          <mpath href="#arc" />
        </animateMotion>
      </g>

      <!-- Shown instead when the viewer has asked for reduced motion. Parked at
           the arc's midpoint (t=0.5 of the quadratic) on its tangent, so they
           get the same composition with nothing moving. -->
      <g class="plane-static" transform="translate(600 565) rotate(-4)">
        <path
          class="plane"
          d="M-7 0 L 6 0 M 1 0 L -3.5 -5 M 1 0 L -3.5 5 M -5.5 0 L -7.5 -2.6 M -5.5 0 L -7.5 2.6"
          stroke="#ffffff"
          stroke-width="1.7"
          stroke-linecap="round"
          fill="none"
        />
      </g>
    </svg>

    <main>
      <p class="eyebrow">Real-time airline management</p>

      <h1>TAILFIN</h1>

      <div class="lockup">
        <span class="rule"></span>
        <span class="sim">Sim</span>
        <span class="rule"></span>
      </div>

      <p class="tagline">
        Coming soon.
        <span class="stay">Stay tuned.</span>
      </p>

      <p class="footnote">tailfinsim.com</p>
    </main>
  </body>
</html>
